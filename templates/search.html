<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/search.js') }}" defer></script>
    <title>Search</title>
</head>


<div class="title-container">
    <h1>Librarry</h1>
</div>
<div class="search-container" id="search-container">
    <!-- <form method="post" class="search-form"> -->
    <!-- <form method="post" class="search-form" onsubmit="showLoadingAnimation()"> -->
    <form class="search-form" onsubmit="event.preventDefault(); startSearch()">
        <div class="search-row">
            <input type="text" name="query" placeholder="Enter book name" class="search-bar" value="{{ query }}" required>
            <button type="submit" class="search-button">
                <span class="button-text">Search</span>
                <div class="button-spinner" id="button-spinner" style="display: none;">
                    <div class="spinner"></div>
                </div>
            </button>
        </div>
        <div class="search-options">
            <select name="base_url" class="url-select">
                {% set urls = [
                "https://audiobookbay.lu",
                "http://audiobookbay.se",
                "http://audiobookbay.fi",
                "http://audiobookbay.is",
                "http://audiobookbay.ws/",
                "http://theaudiobookbay.se/"
                ] %}
                {% for url in urls %}
                <option value="{{ url }}" {% if url==base_url %}selected{% endif %}>{{ url | replace("https://", "") |
                    replace("http://", "") | replace("/", "") }}</option>
                {% endfor %}
            </select>
            {% if jackett_available %}
            <select name="scraper" class="url-select">
                <option value="local" {% if scraper=="local" %}selected{% endif %}>Local</option>
                <option value="jackett" {% if scraper=="jackett" %}selected{% endif %}>Jackett</option>
            </select>
            {% endif %}
            <label class="title-only-label">
                <input type="checkbox" name="title_only" value="1" {% if title_only %}checked{% endif %}> Title only
            </label>
        </div>
    </form>
</div>
